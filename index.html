<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>VaultShare — By GG</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@300;400;500&family=Dancing+Script:wght@700&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#050508;--surface:#0d0d14;--surface2:#13131e;
  --border:rgba(130,80,255,0.18);--accent:#8250ff;--accent2:#00e5ff;
  --text:#e8e0ff;--muted:#6b6688;--success:#00ff9d;--danger:#ff2d78;
  --glow:0 0 30px rgba(130,80,255,0.25);
}
html,body{min-height:100vh;background:var(--bg);color:var(--text);font-family:'Syne',sans-serif}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--accent);border-radius:2px}
.bg-grid{position:fixed;inset:0;pointer-events:none;z-index:0;background-image:linear-gradient(rgba(130,80,255,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(130,80,255,0.04) 1px,transparent 1px);background-size:40px 40px}
.orb{position:fixed;border-radius:50%;filter:blur(80px);pointer-events:none;z-index:0;animation:orb-float 8s ease-in-out infinite}
.orb-1{width:400px;height:400px;background:rgba(130,80,255,0.12);top:-100px;right:-100px}
.orb-2{width:300px;height:300px;background:rgba(0,229,255,0.08);bottom:100px;left:-80px;animation-delay:-4s}
@keyframes orb-float{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-20px) scale(1.05)}}
.wrap{position:relative;z-index:1;max-width:960px;margin:0 auto;padding:0 16px}
header{border-bottom:1px solid var(--border);background:rgba(5,5,8,0.85);backdrop-filter:blur(20px);position:sticky;top:0;z-index:100;padding:14px 0}
.header-inner{display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:10px;font-size:1.2rem;font-weight:800}
.logo-icon{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:16px}
.logo-sub{font-size:0.7rem;font-family:'JetBrains Mono',monospace;color:var(--muted)}
.by-gg{font-family:'Dancing Script',cursive;font-size:1.2rem;font-weight:700;background:linear-gradient(135deg,#8250ff,#00e5ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-left:2px;line-height:1}
.by-gg-float{position:fixed;bottom:18px;right:16px;z-index:50;font-family:'Dancing Script',cursive;font-size:1.4rem;font-weight:700;background:linear-gradient(135deg,#8250ff,#00e5ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;opacity:0.55;pointer-events:none;filter:drop-shadow(0 0 8px rgba(130,80,255,0.35))}
.badge{font-family:'JetBrains Mono',monospace;font-size:0.65rem;background:rgba(0,229,255,0.1);border:1px solid rgba(0,229,255,0.3);color:var(--accent2);padding:3px 8px;border-radius:20px;letter-spacing:1px}
main{padding:32px 0 80px}
.section-title{font-size:0.7rem;font-family:'JetBrains Mono',monospace;letter-spacing:3px;color:var(--muted);text-transform:uppercase;margin-bottom:16px;display:flex;align-items:center;gap:10px}
.section-title::after{content:'';flex:1;height:1px;background:var(--border)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px;margin-bottom:28px;box-shadow:var(--glow)}
.input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:12px 16px;color:var(--text);font-family:'Syne',sans-serif;font-size:0.9rem;outline:none;transition:border-color 0.2s;margin-bottom:14px}
.input:focus{border-color:var(--accent)}
.input::placeholder{color:var(--muted)}
.drop-zone{border:2px dashed var(--border);border-radius:12px;padding:36px 20px;text-align:center;cursor:pointer;transition:all 0.2s;position:relative;overflow:hidden}
.drop-zone:hover,.drop-zone.drag-over{border-color:var(--accent);background:rgba(130,80,255,0.05)}
.drop-zone input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.drop-icon{font-size:2.2rem;margin-bottom:10px}
.drop-text{font-size:0.95rem;font-weight:600}
.drop-sub{font-size:0.75rem;color:var(--muted);margin-top:6px;font-family:'JetBrains Mono',monospace}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{display:flex;align-items:center;gap:6px;background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:4px 10px 4px 6px;font-size:0.72rem;font-family:'JetBrains Mono',monospace;color:var(--muted)}
.chip-rm{cursor:pointer;color:var(--danger);background:none;border:none;font-size:0.9rem;line-height:1;margin-left:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 22px;border-radius:10px;border:none;cursor:pointer;font-family:'Syne',sans-serif;font-weight:700;font-size:0.85rem;transition:all 0.2s}
.btn-primary{background:linear-gradient(135deg,var(--accent),#5d2fff);color:#fff;box-shadow:0 4px 20px rgba(130,80,255,0.35);width:100%;margin-top:16px}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 28px rgba(130,80,255,0.5)}
.btn-primary:disabled{opacity:0.4;cursor:not-allowed;transform:none}
.btn-sm{padding:6px 14px;font-size:0.75rem;border-radius:7px}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--muted)}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn-danger{background:rgba(255,45,120,0.12);border:1px solid rgba(255,45,120,0.3);color:var(--danger)}
.btn-copy{background:rgba(0,229,255,0.08);border:1px solid rgba(0,229,255,0.2);color:var(--accent2)}
.btn-copy:hover{background:rgba(0,229,255,0.16)}
.btn-copy.copied{background:rgba(0,255,157,0.1);border-color:rgba(0,255,157,0.3);color:var(--success)}
.progress-wrap{height:4px;background:var(--surface2);border-radius:2px;margin:12px 0;overflow:hidden;display:none}
.progress-bar{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:2px;transition:width 0.3s;width:0%}
.folders-list{display:flex;flex-direction:column;gap:14px}
.folder-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px 20px;animation:slide-in 0.4s ease;transition:border-color 0.2s}
.folder-card:hover{border-color:rgba(130,80,255,0.4);box-shadow:var(--glow)}
@keyframes slide-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.folder-name{font-weight:700;font-size:1rem;margin-bottom:8px}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.pill{font-family:'JetBrains Mono',monospace;font-size:0.65rem;padding:3px 8px;border-radius:20px;display:flex;align-items:center;gap:4px}
.pill-files{background:rgba(130,80,255,0.1);border:1px solid rgba(130,80,255,0.2);color:var(--accent)}
.pill-views{background:rgba(0,229,255,0.08);border:1px solid rgba(0,229,255,0.2);color:var(--accent2)}
.pill-time{background:rgba(255,180,0,0.08);border:1px solid rgba(255,180,0,0.2);color:#ffb400}
.pill-expired{background:rgba(255,45,120,0.08);border:1px solid rgba(255,45,120,0.2);color:var(--danger)}
.link-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.link-box{flex:1;min-width:0;font-family:'JetBrains Mono',monospace;font-size:0.7rem;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px 12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.empty-icon{font-size:2.5rem;margin-bottom:12px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:12px 24px;font-size:0.85rem;z-index:9999;box-shadow:0 8px 40px rgba(0,0,0,0.4);animation:toast-in 0.3s ease;white-space:nowrap;display:none}
@keyframes toast-in{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,0.2);border-top-color:#fff;border-radius:50%;animation:spin 0.6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#public-view{display:none}
.pub-header{border-bottom:1px solid var(--border);background:rgba(5,5,8,0.9);backdrop-filter:blur(20px);position:sticky;top:0;z-index:100;padding:16px 0}
.pub-header-inner{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.pub-folder-name{font-size:1.2rem;font-weight:800}
.pub-meta{font-size:0.7rem;color:var(--muted);font-family:'JetBrains Mono',monospace;margin-top:2px}
.view-counter{display:flex;align-items:center;gap:8px;font-family:'JetBrains Mono',monospace;font-size:0.8rem;background:rgba(0,229,255,0.06);border:1px solid rgba(0,229,255,0.2);border-radius:20px;padding:6px 14px;color:var(--accent2);animation:pulse-glow 2s ease-in-out infinite}
@keyframes pulse-glow{0%,100%{box-shadow:0 0 0 rgba(0,229,255,0)}50%{box-shadow:0 0 16px rgba(0,229,255,0.2)}}
.view-dot{width:6px;height:6px;border-radius:50%;background:var(--success);animation:blink 1.5s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
.pub-main{padding:28px 0 60px}
.gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:28px}
.gallery-item{aspect-ratio:1;border-radius:10px;overflow:hidden;cursor:pointer;border:1px solid var(--border);transition:transform 0.2s,border-color 0.2s;background:var(--surface)}
.gallery-item:hover{transform:scale(1.03);border-color:var(--accent)}
.gallery-item img{width:100%;height:100%;object-fit:cover;display:block}
.video-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.video-item{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.video-item video{width:100%;display:block;max-height:220px;background:#000}
.video-label{padding:8px 12px;font-size:0.72rem;font-family:'JetBrains Mono',monospace;color:var(--muted)}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,0.96);z-index:1000;display:none;align-items:center;justify-content:center}
.lightbox.open{display:flex}
.lightbox img{max-width:95vw;max-height:90vh;object-fit:contain;border-radius:8px}
.lb-close{position:absolute;top:20px;right:20px;background:rgba(255,255,255,0.1);border:none;border-radius:50%;width:40px;height:40px;font-size:1.2rem;cursor:pointer;color:#fff;display:flex;align-items:center;justify-content:center}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,0.1);border:none;border-radius:50%;width:44px;height:44px;font-size:1.4rem;cursor:pointer;color:#fff;display:flex;align-items:center;justify-content:center}
.lb-prev{left:16px}.lb-next{right:16px}
.not-found{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;text-align:center;gap:14px}
@media(max-width:600px){.gallery-grid{grid-template-columns:repeat(2,1fr)}.video-grid{grid-template-columns:1fr}.link-row{flex-direction:column}.link-box{width:100%}}
#auth-view{display:none;min-height:100vh;align-items:center;justify-content:center;padding:20px}
#home-view{display:none}
.load-err{max-width:380px;margin:80px auto;text-align:center;padding:24px;color:var(--muted)}
.auth-card{max-width:380px;width:100%}
.auth-tabs{display:flex;gap:8px;margin-bottom:18px}
.auth-tab{flex:1;text-align:center;padding:10px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);color:var(--muted);cursor:pointer;font-weight:700;font-size:0.85rem}
.auth-tab.active{background:linear-gradient(135deg,var(--accent),#5d2fff);color:#fff;border-color:transparent}
.auth-err{color:var(--danger);font-size:0.78rem;margin-bottom:10px;min-height:1em}
.pill-owner{background:rgba(255,180,0,0.08);border:1px solid rgba(255,180,0,0.2);color:#ffb400}
.user-bar{display:flex;align-items:center;gap:10px;font-size:0.75rem;color:var(--muted);font-family:'JetBrains Mono',monospace}
.user-bar .btn-sm{padding:5px 10px}
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<!-- Floating By GG -->
<div class="by-gg-float">By: GG</div>

<!-- AUTH VIEW -->
<div id="auth-view">
  <div class="card auth-card">
    <div class="auth-tabs">
      <div class="auth-tab active" id="tab-login" onclick="switchAuthTab('login')">Entrar</div>
      <div class="auth-tab" id="tab-register" onclick="switchAuthTab('register')">Crear cuenta</div>
    </div>
    <div class="auth-err" id="auth-err"></div>
    <input class="input" id="auth-name" placeholder="Tu nombre" style="display:none"/>
    <input class="input" id="auth-email" type="email" placeholder="Correo" autocomplete="username"/>
    <input class="input" id="auth-pass" type="password" placeholder="Contraseña" autocomplete="current-password"/>
    <button class="btn btn-primary" id="auth-btn" onclick="doAuth()">Entrar</button>
    <div style="text-align:center;color:var(--muted);font-size:0.75rem;margin:14px 0;font-family:'JetBrains Mono',monospace">— o —</div>
    <button class="btn btn-ghost" style="width:100%" onclick="doGoogleLogin()">🔵 Continuar con Google</button>
  </div>
</div>

<!-- HOME VIEW -->
<div id="home-view">
  <header>
    <div class="wrap header-inner">
      <div class="logo">
        <div class="logo-icon">🔐</div>
        <div>
          <div>VaultShare</div>
          <div class="logo-sub">SECURE FILE SHARING</div>
        </div>
        <div class="by-gg">By: GG</div>
      </div>
      <div class="user-bar">
        <span id="user-label">—</span>
        <button class="btn btn-sm btn-ghost" onclick="doLogout()">Salir</button>
      </div>

  </header>
  <main>
    <div class="wrap">
      <div class="card">
        <div class="section-title" style="margin-top:0">Nueva Carpeta</div>
        <input class="input" id="folder-name" placeholder="Nombre de la carpeta (opcional)"/>
        <div class="drop-zone" id="drop-zone">
          <input type="file" id="file-input" multiple accept="image/*,video/*"/>
          <div class="drop-icon">📂</div>
          <div class="drop-text">Arrastra o toca para subir archivos</div>
          <div class="drop-sub">Imágenes y videos · Múltiples archivos</div>
        </div>
        <div class="chips" id="chips"></div>
        <div class="progress-wrap" id="progress-wrap">
          <div class="progress-bar" id="progress-bar"></div>
        </div>
        <button class="btn btn-primary" id="create-btn" onclick="createFolder()">
          🔗 Crear enlace compartido
        </button>
      </div>
      <div class="section-title">Carpetas Activas</div>
      <div class="folders-list" id="folders-list">
        <div class="empty"><div class="empty-icon">🗂️</div><div>No hay carpetas activas.<br>Crea una para empezar.</div></div>
      </div>
    </div>
  </main>
</div>

<!-- PUBLIC VIEW -->
<div id="public-view">
  <header class="pub-header">
    <div class="wrap pub-header-inner">
      <div>
        <div class="pub-folder-name" id="pub-name">—</div>
        <div class="pub-meta" id="pub-meta">—</div>
      </div>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <div class="view-counter"><div class="view-dot"></div><span id="pub-views">0 vistas</span></div>
        <button class="btn btn-sm btn-copy" id="pub-copy-btn" onclick="copyPublicLink()">📋 Compartir</button>
      </div>
    </div>
  </header>
  <div class="pub-main">
    <div class="wrap" id="pub-content"></div>
  </div>
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <img id="lb-img" src="" alt=""/>
  <button class="lb-close" onclick="closeLightbox()">✕</button>
  <button class="lb-nav lb-prev" onclick="lbNav(-1,event)">‹</button>
  <button class="lb-nav lb-next" onclick="lbNav(1,event)">›</button>
</div>

<div class="toast" id="toast"></div>

<script>
let sb;
try{
  if(typeof supabase==='undefined')throw new Error('La librería no cargó (conexión lenta o bloqueada)');
  const SUPABASE_URL = 'https://ypuavudfjlwbcyiiyscy.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_nVyJVI2xWRm4Z7VKHk6sGw_wFd5tawP';
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
}catch(e){
  document.body.innerHTML=`<div class="load-err"><div style="font-size:2.5rem;margin-bottom:12px">⚠️</div><div style="font-weight:700;margin-bottom:8px">No se pudo cargar VaultShare</div><div style="font-size:0.85rem;margin-bottom:16px">Revisa tu conexión a internet e intenta de nuevo.</div><button class="btn btn-primary" style="width:auto;padding:10px 24px" onclick="location.reload()">🔄 Reintentar</button></div>`;
  throw e;
}

let selectedFiles = [];
let lbImages = [];
let lbIndex = 0;
let currentUser = null;
let currentProfile = null;
let authMode = 'login';
let addFilesTargetFolder = null;

function genId(n=12){return Array.from(crypto.getRandomValues(new Uint8Array(n))).map(b=>b.toString(36)).join('').slice(0,n)}
function showToast(msg,dur=2500){const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';setTimeout(()=>t.style.display='none',dur)}
function timeLeft(exp){const d=exp-Date.now();if(d<=0)return'Expirado';const h=Math.floor(d/3600000),m=Math.floor((d%3600000)/60000);return`${h}h ${m}m`}

// ---------- AUTH ----------
function switchAuthTab(mode){
  authMode=mode;
  document.getElementById('tab-login').classList.toggle('active',mode==='login');
  document.getElementById('tab-register').classList.toggle('active',mode==='register');
  document.getElementById('auth-name').style.display=mode==='register'?'block':'none';
  document.getElementById('auth-btn').textContent=mode==='register'?'Crear cuenta':'Entrar';
  document.getElementById('auth-err').textContent='';
}

async function doAuth(){
  const email=document.getElementById('auth-email').value.trim();
  const pass=document.getElementById('auth-pass').value;
  const name=document.getElementById('auth-name').value.trim();
  const errEl=document.getElementById('auth-err');
  const btn=document.getElementById('auth-btn');
  errEl.textContent='';
  if(!email||!pass){errEl.textContent='Falta correo o contraseña';return}
  if(authMode==='register'&&!name){errEl.textContent='Falta tu nombre';return}
  btn.disabled=true;
  try{
    if(authMode==='register'){
      const {error}=await sb.auth.signUp({email,password:pass,options:{data:{name}}});
      if(error)throw error;
      showToast('✅ Cuenta creada');
    }else{
      const {error}=await sb.auth.signInWithPassword({email,password:pass});
      if(error)throw error;
    }
    await refreshSession();
  }catch(e){errEl.textContent=e.message}
  btn.disabled=false;
}

async function doGoogleLogin(){
  const {error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname}});
  if(error)showToast('❌ '+error.message);
}

async function doLogout(){
  await sb.auth.signOut();
  currentUser=null;currentProfile=null;
  route();
}

async function refreshSession(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){
    currentUser=null;currentProfile=null;
    route();
    return;
  }
  currentUser=session.user;
  const {data:profile}=await sb.from('profiles').select('*').eq('id',currentUser.id).single();
  currentProfile=profile;
  document.getElementById('user-label').textContent=(profile?.name||currentUser.email)+(profile?.is_admin?' · admin':'');
  route();
}
sb.auth.onAuthStateChange((_event,_session)=>{refreshSession()});

document.getElementById('file-input').addEventListener('change',e=>{addFiles(e.target.files)});
const dz=document.getElementById('drop-zone');
dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('drag-over')});
dz.addEventListener('dragl
